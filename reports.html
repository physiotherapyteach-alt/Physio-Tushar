<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reports | Tushar's Physiotherapy</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;font-family:Arial;color:#172033}
.sidebar{position:fixed;width:245px;height:100vh;background:#0b1f3a;color:white;padding:25px 15px}
.logo{font-size:21px;font-weight:800;padding:0 12px 30px}
.logo span{color:#38bdf8}
.nav a{display:block;color:#cbd5e1;padding:13px 15px;margin:5px 0;border-radius:12px;text-decoration:none}
.nav a:hover,.nav .active{background:#16365f;color:white}
.main{margin-left:245px;padding:25px}
.controls{display:flex;gap:12px;align-items:center;margin:20px 0}
input,button{padding:12px;border-radius:10px;border:1px solid #dbe3ec}
button{background:#0ea5e9;color:white;border:0;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:white;border-radius:18px;padding:21px;box-shadow:0 7px 25px #153b6510}
.label{font-size:13px;color:#64748b}
.amount{font-size:26px;font-weight:800;margin-top:7px}
.table{margin-top:20px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:800px}
th,td{padding:13px;border-bottom:1px solid #edf0f5;text-align:left}
th{font-size:12px;color:#64748b}
@media(max-width:900px){.sidebar{width:70px}.logo{font-size:0}.nav a{font-size:0;text-align:center}.main{margin-left:70px}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.main{padding:15px}.grid{grid-template-columns:1fr}.controls{flex-wrap:wrap}}
</style>
</head>

<body>

<aside class="sidebar">
<div class="logo">Tushar's <span>Physio</span></div>
<nav class="nav">
<a href="index.html">🏠 Dashboard</a>
<a href="patients.html">👥 Patients</a>
<a href="new-patient.html">➕ New Patient</a>
<a href="visits.html">🩺 Visits</a>
<a href="finance.html">💰 Finance</a>
<a class="active" href="reports.html">📊 Reports</a>
</nav>
</aside>

<main class="main">

<h1>Reports & Analytics</h1>
<p>Analyze your physiotherapy practice.</p>

<div class="controls">
<input type="month" id="month">
<button onclick="exportCSV()">⬇ Export CSV</button>
</div>

<div class="grid">

<div class="card">
<div class="label">Monthly Visits</div>
<div class="amount" id="visits">0</div>
</div>

<div class="card">
<div class="label">Monthly Patients</div>
<div class="amount" id="patients">0</div>
</div>

<div class="card">
<div class="label">Monthly Income</div>
<div class="amount">৳<span id="income">0</span></div>
</div>

<div class="card">
<div class="label">Monthly Due</div>
<div class="amount">৳<span id="due">0</span></div>
</div>

</div>

<div class="card table">

<h2>Monthly Visit Report</h2>

<table>
<thead>
<tr>
<th>Date</th>
<th>Patient</th>
<th>Session</th>
<th>Fee</th>
<th>Paid</th>
<th>Due</th>
<th>Treatment</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

</main>

<script>

const visits=
JSON.parse(localStorage.getItem("tushar_visits")||"[]");

const monthInput=document.getElementById("month");

const today=new Date().toISOString().slice(0,7);

monthInput.value=today;

function render(){

const month=monthInput.value;

const data=visits.filter(v=>
v.date.startsWith(month)
);

const patients=new Set(data.map(v=>v.patientId));

const income=data.reduce((s,v)=>s+Number(v.paid||0),0);

const due=data.reduce((s,v)=>s+Number(v.due||0),0);

document.getElementById("visits").textContent=data.length;
document.getElementById("patients").textContent=patients.size;
document.getElementById("income").textContent=income;
document.getElementById("due").textContent=due;

const table=document.getElementById("table");

table.innerHTML="";

if(!data.length){

table.innerHTML=
'<tr><td colspan="7">No data for this month.</td></tr>';

return;

}

data.forEach(v=>{

table.innerHTML+=`
<tr>
<td>${v.date}</td>
<td><b>${v.patientName}</b></td>
<td>${v.session}</td>
<td>৳${v.fee}</td>
<td>৳${v.paid}</td>
<td>৳${v.due}</td>
<td>${v.treatment||"-"}</td>
</tr>
`;

});

}

function exportCSV(){

const month=monthInput.value;

const data=visits.filter(v=>
v.date.startsWith(month)
);

let csv="Date,Patient,Session,Fee,Paid,Due,Treatment\n";

data.forEach(v=>{

csv+=`"${v.date}","${v.patientName}","${v.session}","${v.fee}","${v.paid}","${v.due}","${(v.treatment||"").replace(/"/g,'""')}"\n`;

});

const blob=new Blob([csv],{type:"text/csv"});

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;
a.download="Tushar-Physiotherapy-"+month+".csv";

a.click();

URL.revokeObjectURL(url);

}

monthInput.addEventListener("change",render);

render();

</script>

</body>
</html>
